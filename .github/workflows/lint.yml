name: Code Quality Check

on:
  pull_request:

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: アクション参照が SHA 固定か確認
        run: bash scripts/check-action-pins.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Generate Astro types
        run: pnpm astro sync

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true
        id: lint

      - name: Run TypeScript Type Check
        run: pnpm type-check
        continue-on-error: true
        id: type-check

      - name: Run Security Check
        run: pnpm security-check
        continue-on-error: true
        id: security-check

      - name: Check Results
        if: steps.lint.outcome != 'success' || steps.type-check.outcome != 'success' || steps.security-check.outcome != 'success'
        run: |
          echo "::error::コード品質チェックでエラーが検出されました"
          echo ""
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "::error::ESLintのチェックでエラーが検出されました"
            echo "コードを修正するには 'pnpm lint:fix' を実行するか、手動で問題を解決してください"
            echo ""
          fi
          if [ "${{ steps.type-check.outcome }}" != "success" ]; then
            echo "::error::TypeScript型チェックでエラーが検出されました"
            echo "型エラーを修正してください"
            echo "詳細は上記の 'Run TypeScript Type Check' ステップを確認してください"
            echo ""
          fi
          if [ "${{ steps.security-check.outcome }}" != "success" ]; then
            echo "::warning::セキュリティチェックで脆弱性が検出されました"
            echo "'pnpm audit' を実行して詳細を確認し、必要に応じて修正してください"
            echo "注意: 脆弱性は別PRで対応予定の場合は、この警告を無視できます"
            echo ""
          fi
          # セキュリティチェックのみ失敗している場合は警告として扱い、exit 1しない
          if [ "${{ steps.lint.outcome }}" != "success" ] || [ "${{ steps.type-check.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Success Message
        if: steps.lint.outcome == 'success' && steps.type-check.outcome == 'success'
        run: |
          echo "✅ すべてのコード品質チェックが成功しました！"
          echo "  - ESLint: ✅"
          echo "  - TypeScript型チェック: ✅"
          if [ "${{ steps.security-check.outcome }}" == "success" ]; then
            echo "  - セキュリティチェック: ✅"
          else
            echo "  - セキュリティチェック: ⚠️ (脆弱性が検出されましたが、別PRで対応予定)"
          fi
