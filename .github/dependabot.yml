version: 2
updates:
  # npm用の設定
  # 自動マージは dependabot.yml では行わず、.github/workflows/dependabot-auto-merge.yml が担当する
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    labels:
      - "dependencies"
      - "npm"
    groups:
      # 本番依存の minor / patch を1 PR にまとめる（major は個別のまま人手レビュー）
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # 開発依存の minor / patch を1 PR にまとめる
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actionsのワークフロー用の設定
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
